spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mentor}
    username: ${DB_USER:mentor}
    password: ${DB_PASSWORD:mentor}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  api-key: ${APP_API_KEY}